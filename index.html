<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="依當天當地氣溫、自選色系與風格推薦穿搭。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315161a'/%3E%3Cpath d='M32 14a6 6 0 0 1 6 6c0 3-2 4.5-4.5 6L32 27.5 10 42a3 3 0 0 0 1.7 5.5h40.6A3 3 0 0 0 54 42L32 27.5' fill='none' stroke='%23f7f8fa' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>OOTD 今天穿什麼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: masthead, then a 330px control rail beside one lookbook sheet; on phones the lookbook comes first and the rail follows */
:root{
  --bg:#e9ebef; --surface:#f7f8fa; --tile:#ffffff;
  --ink:#15161a; --ink-2:#585c66; --line:#d3d6dd; --line-2:#b4b8c2;
  --accent:#2b38c4; --accent-ink:#ffffff; --accent-soft:#e2e5fa;
  --sel:#15161a; --sel-ink:#f7f8fa;
  --glyph-line:#24262c; --photo-hi:#fbfaf7; --photo-lo:#e8e6e0; --photo-ink:#3d3a34;
  --ok:#2b7a52; --warn:#a8650c; --cold:#3460c4;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-head:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111216; --surface:#191a1f; --tile:#212329;
    --ink:#ebecef; --ink-2:#a0a4ae; --line:#2f323a; --line-2:#474b55;
    --accent:#9aa2ff; --accent-ink:#10121c; --accent-soft:#262a4a;
    --sel:#ebecef; --sel-ink:#15161a;
    --glyph-line:#d6d8de; --photo-hi:#dddbd5; --photo-lo:#c7c4bc;
    --ok:#6cc596; --warn:#e3a04a; --cold:#86a8f3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111216; --surface:#191a1f; --tile:#212329;
  --ink:#ebecef; --ink-2:#a0a4ae; --line:#2f323a; --line-2:#474b55;
  --accent:#9aa2ff; --accent-ink:#10121c; --accent-soft:#262a4a;
  --sel:#ebecef; --sel-ink:#15161a;
  --glyph-line:#d6d8de; --photo-hi:#dddbd5; --photo-lo:#c7c4bc;
  --ok:#6cc596; --warn:#e3a04a; --cold:#86a8f3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0;white-space:nowrap}

.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 56px;display:grid;gap:22px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.word{font-family:var(--f-display);font-style:italic;font-weight:800;font-size:44px;line-height:1;letter-spacing:-.01em;color:var(--accent)}
.brand h1{font-family:var(--f-head);font-weight:700;font-size:22px;letter-spacing:.04em}
.src{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.src a{color:inherit;text-underline-offset:2px}
.src b{font-weight:500;color:var(--ink)}

.app{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
@media (min-width:920px){
  .app{grid-template-columns:330px minmax(0,1fr)}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
}
@media (max-width:919px){ .look{order:-1} }

/* control rail */
.rail{background:var(--surface);border:1px solid var(--line);padding:20px;display:grid;gap:24px;min-width:0}
.grp{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.lbl{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lbl > span:first-child{font-weight:700;font-size:15px}
.code{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}

select{width:100%;padding:10px 12px;background:var(--tile);border:1px solid var(--line-2);border-radius:3px;font-size:15px;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
select:focus-visible,.sr:focus-visible + label,.tile:focus-visible,.btn:focus-visible,.switch input:focus-visible + .track,input[type=range]:focus-visible,.check input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{display:grid;gap:0;min-width:70px;padding:7px 10px;border:1px solid var(--line-2);border-radius:3px;background:var(--tile);cursor:pointer;line-height:1.35}
.day b{font-size:14px;font-weight:700}
.day{flex:none}
.day span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr:checked + .day{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.sr:checked + .day span{color:inherit;opacity:.75}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line-2);border-radius:3px;background:var(--tile);cursor:pointer;font-size:14px;line-height:1.3}
.sr:checked + .chip{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.sr:checked + .chip small{color:inherit;opacity:.72}

.pal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal .chip{display:grid;gap:6px;justify-items:start;padding:9px 10px}
.dots{display:flex;gap:0;border:1px solid var(--line-2)}
.dots i{display:block;width:16px;height:14px}

.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.styles .chip{display:grid;gap:1px;justify-items:start;padding:8px 11px}
.styles .chip b{font-size:15px}
.styles .chip small{font-size:12px;color:var(--ink-2)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;background:var(--tile)}
.seg label{display:block;text-align:center;padding:8px 6px;cursor:pointer;font-size:14px;border-left:1px solid var(--line)}
.seg input:first-child + label{border-left:0}
.seg .sr:checked + label{background:var(--sel);color:var(--sel-ink)}

.manual{display:grid;gap:10px;border-top:1px dashed var(--line-2);padding-top:12px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;position:relative}
.switch input{position:absolute;opacity:0;width:36px;height:20px;margin:0}
.track{width:36px;height:20px;border-radius:10px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--tile);transition:transform .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:disabled + .track{opacity:.6}
.note{font-size:13px;color:var(--warn)}
.search{display:flex;gap:8px}
.search input{flex:1;width:0;min-width:0;padding:9px 12px;background:var(--tile);border:1px solid var(--line-2);border-radius:3px;font-size:14px}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search button{padding:9px 14px;border:1px solid var(--line-2);border-radius:3px;background:var(--tile);cursor:pointer;font-size:14px;white-space:nowrap}
.search button:disabled{opacity:.5;cursor:default}
.found{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.status{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;line-height:1.5}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2);flex:none}
.status[data-mode="live"] .dot{background:var(--ok)}
.status[data-mode="loading"] .dot,.status[data-mode="warn"] .dot{background:var(--warn)}
.status > span:nth-child(2){flex:1;min-width:0}
.status button{padding:3px 10px;border:1px solid var(--line-2);border-radius:3px;background:var(--tile);cursor:pointer;font-size:12px}
#manualBox{display:grid;gap:10px}
.range-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.range-row output{font-family:var(--f-display);font-style:italic;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

/* lookbook sheet */
.look{background:var(--surface);border:1px solid var(--line);padding:24px;display:grid;gap:26px;min-width:0}
.wx{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"stamp meta" "temp meta";gap:6px 32px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px}
.stamp{grid-area:stamp;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.stamp .d{font-family:var(--f-display);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
.stamp .w{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;color:var(--ink-2)}
.stamp .c{font-family:var(--f-head);font-weight:700;font-size:18px}
.temp{grid-area:temp;display:flex;align-items:flex-start;gap:10px}
.temp .n{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(84px,13vw,136px);line-height:.82;letter-spacing:-.03em;font-variant-numeric:lining-nums}
.temp .u{display:grid;gap:4px;padding-top:6px}
.temp .u sup{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--accent);vertical-align:baseline;top:0}
.temp .u small{font-size:12px;color:var(--ink-2);writing-mode:vertical-rl;letter-spacing:.2em}
.meta{grid-area:meta;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin:0;align-self:end}
.meta div{min-width:0;border-top:1px solid var(--line);padding-top:8px}
.meta dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.meta dd{margin:2px 0 0;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .wx{grid-template-columns:minmax(0,1fr);grid-template-areas:"stamp" "temp" "meta";gap:14px}
}

.look-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.look-title{display:grid;gap:4px;min-width:0}
.viewseg{flex:none;min-width:210px}
.look-head h2{font-family:var(--f-head);font-weight:700;font-size:28px;letter-spacing:.03em}
.look-head h2 .x{font-family:var(--f-display);font-style:italic;font-weight:400;color:var(--accent);padding-inline:.15em}
.look-head p{font-size:15px;color:var(--ink-2)}

.flat{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
@media (max-width:560px){
  .flat{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flat[data-odd="1"] > .tile:first-child{grid-column:1 / -1}
  .flat[data-odd="1"] > .tile:first-child .tile-art{width:55%;justify-self:center}
}
.tile{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto;align-content:start;gap:4px;text-align:left;padding:12px 12px 14px;background:var(--tile);border:1px solid var(--line);border-radius:2px;cursor:pointer;min-width:0;transition:border-color .15s}
.tile:hover{border-color:var(--ink-2)}
.tile.is-spare{border-style:dashed;border-color:var(--line-2)}
.tile-slot{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:12px}
.tile-slot b{font-weight:700}
.tile-slot i{font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--ink-2)}
.tile-tag{margin-left:auto;font-size:11px;padding:0 6px;border:1px solid var(--line-2);border-radius:2px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.tile-art{display:grid;place-items:center;aspect-ratio:1/1;width:100%;max-width:100%;margin-block:2px;border-radius:2px;background:radial-gradient(120% 90% at 50% 35%,var(--photo-hi),var(--photo-lo))}
.tile-art svg{width:88%;height:88%;overflow:visible}
.fx{position:absolute;width:0;height:0;overflow:hidden}
.tile-art.pop svg{animation:pop .32s ease-out}
@keyframes pop{from{transform:scale(.92) rotate(-2deg);opacity:.35}to{transform:none;opacity:1}}
.tile-name{font-size:15px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.tile-color{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.tile-color i{width:11px;height:11px;border:1px solid var(--line-2);flex:none}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:700px){.stage{grid-template-columns:minmax(0,360px) minmax(0,1fr)}}
.fig-box{display:grid;justify-items:center;gap:8px;padding:14px 10px 12px;border:1px solid var(--line);border-radius:2px;background:radial-gradient(120% 80% at 50% 30%,var(--photo-hi),var(--photo-lo))}
#fig{width:100%;max-width:340px}
#fig > svg{display:block;width:100%;height:auto;overflow:visible;animation:figin .35s ease-out}
@keyframes figin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.fig-opt{color:var(--photo-ink)}
.wear{display:grid;gap:4px;min-width:0}
.wear-list{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:6px}
.wear-list button{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;text-align:left;background:var(--tile);border:1px solid var(--line);border-radius:2px;cursor:pointer}
.wear-list button:hover{border-color:var(--ink-2)}
.wear-list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.w-fab{display:block;width:30px;height:30px;overflow:hidden;border:1px solid var(--line-2)}
.w-main{display:grid;gap:1px;min-width:0}
.w-name{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.w-name b{font-weight:700;margin-right:8px;font-size:12px;color:var(--ink-2)}
.w-sub{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.w-tag{font-size:11px;padding:0 6px;border:1px dashed var(--line-2);border-radius:2px;color:var(--ink-2);white-space:nowrap}
.tile-scale{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--ink-2);margin-top:-2px}
.tile-scale i{display:block;height:5px;border:1px solid var(--ink-2);border-top:0;flex:none}
.tile-ref{font-size:11px;line-height:1.4;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px;overflow-wrap:anywhere}
.notes a{color:var(--accent);text-underline-offset:2px}

.strip-wrap{display:grid;gap:10px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:0;border:1px solid var(--line);background:var(--tile)}
.sw{display:grid;align-content:start;min-width:0;background:var(--tile)}
.sw-fab{display:block;height:46px;overflow:hidden}
.sw-fab svg,.w-fab svg{display:block;width:100%;height:100%}
.sw-lab{padding:6px 8px 7px;font-size:12px;line-height:1.35;border-top:1px solid var(--line)}
.sw-lab em{display:block;font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase}
.lbl-sm{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.lbl-sm b{font-family:var(--f-body);font-weight:700;letter-spacing:.04em;color:var(--ink);margin-right:8px;font-size:13px;text-transform:none}

.notes{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:700px){.notes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.notes ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.notes li{position:relative;padding-left:16px;font-size:14px;line-height:1.65}
.notes li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--ink)}
.notes .style-li::before{background:var(--accent)}

.clo{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.clo-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.cold{color:var(--cold)}
.bar{position:relative;height:10px;background:var(--line);border-radius:1px;margin-top:4px}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:1px;transition:width .3s ease}
.bar .mark{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--accent)}
.scale{position:relative;height:16px;font-family:var(--f-mono);font-size:10px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.scale span{position:absolute;top:0;transform:translateX(-50%)}
.scale span:first-child{transform:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:8px;background:var(--ink)}
.legend i.m{width:3px;height:14px;background:var(--accent)}
.fine{font-size:12px;color:var(--ink-2)}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.btn{padding:11px 18px;border-radius:3px;border:1px solid var(--line-2);background:var(--tile);cursor:pointer;font-size:15px;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;padding-inline:24px}
.btn.primary:hover{filter:brightness(1.08)}
.hint{font-size:13px;color:var(--ink-2)}
#copyBox{width:100%;min-height:150px;padding:10px;border:1px solid var(--line-2);background:var(--tile);font-family:var(--f-mono);font-size:12px;border-radius:3px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:10px 14px;background:var(--sel);color:var(--sel-ink);border-radius:3px;font-size:14px;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:13px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div class="brand">
      <span class="word" aria-hidden="true">OOTD</span>
      <h1>今天穿什麼</h1>
    </div>
    <p class="src" id="src">中央氣象署一週預報・10/12 擷取</p>
  </header>

  <div class="app">
    <aside class="rail" aria-label="穿搭條件">
      <section class="grp">
        <div class="lbl"><span>地點與日期</span><span class="code">Where · When</span></div>

/* ---------- weather context ---------- */
function weatherCtx(){
  if (state.manual){
    var desc = {sun:"晴",cloud:"多雲",rain:"下雨"}[state.mW];
    return {manual:true, T:state.mT, lo:null, hi:null, flo:null, fhi:null, uv:null, pp:null, desc:desc,
      rain: state.mW==="rain" ? 2 : 0, swing: state.mSwing ? 8 : 0,
      sunny: state.mW==="sun" && state.mT>=24 && state.period!=="night"};
  }
  var r = currentRow();
  var lo=r[1], hi=r[2], flo=r[3], fhi=r[4], uv=r[5], dd=r[6], nd=r[7];
  var ppD = r.length>8 ? r[8] : null, ppN = r.length>9 ? r[9] : null, wind = r[10] || null, gust = r.length>11 ? r[11] : null;
  var T, swing, desc, rain, pp;
  if (state.period==="day"){ T = Math.round(flo*0.2 + fhi*0.8); swing = 0; desc = dd; rain = rainLv(dd,ppD); pp = ppD; }
  else if (state.period==="night"){ T = Math.round(flo*0.8 + fhi*0.2); swing = 0; desc = nd; rain = rainLv(nd,ppN); pp = ppN; wind = null; gust = null; }
  else {
    T = Math.round(flo*0.4 + fhi*0.6); swing = hi-lo; desc = dd===nd ? dd : dd+"，晚上"+nd;
    rain = Math.max(rainLv(dd,ppD), rainLv(nd,ppN)); pp = (ppD==null && ppN==null) ? null : Math.max(ppD||0, ppN||0);
  }
  return {manual:false, T:T, lo:lo, hi:hi, flo:flo, fhi:fhi, uv:uv, pp:pp, desc:desc, rain:rain, swing:swing, wind:wind, gust:gust,
    sunny: uv!=null && uv>=7 && T>=22 && state.period!=="night", date:r[0]};
}
function band(T){
  if (T>=29) return ["炎熱","透氣短袖為主"];
  if (T>=26) return ["偏熱","短袖就好"];
  if (T>=23) return ["舒適","短袖或薄長袖都可以"];
  if (T>=19) return ["微涼","長袖再加一件薄外套"];
  if (T>=15) return ["涼","針織或帽T，外面再疊外套"];
  if (T>=11) return ["冷","毛衣配厚外套"];
  return ["很冷","發熱衣打底，大衣或羽絨上場"];
}

/* ---------- outfit engine ---------- */
var LABELS = {inner:["打底","Base"], top:["上衣","Top"], mid:["中層","Mid"], outer:["外套","Outer"], bottom:["下身","Bottom"],
  shoes:["鞋款","Shoes"], head:["配件","Accessory"], bag:["包款","Bag"], extra:["備用","Spare"], umb:["雨具","Rain"]};

function build(w){
  var T = w.T, st = state.style, gd = state.gender, P = PALETTES[state.palette];
  var base = hash([state.city, w.date||"m", state.period, state.palette, st, gd, T, w.rain, state.manual?1:0, state.shuffle].join("|"));
  function gOK(it){ return gd==="u" ? it.g==="u" : (it.g==="u" || it.g===gd); }
  function rFor(key){ return rng(base ^ hash(key) ^ Math.imul((state.bump[key]||0)+1, 2654435761)); }
  function choose(key, slot, filt, temp){
    var r = rFor(key);
    var p = ITEMS.filter(function(it){ return it.slot===slot && gOK(it) && (!filt || filt(it)); });
    if (!p.length) p = ITEMS.filter(function(it){ return it.slot===slot && gOK(it); });
    var inT = p.filter(function(it){ return temp>=it.lo && temp<=it.hi; });
    if (!inT.length){
      var dist = function(it){ return temp<it.lo ? it.lo-temp : temp-it.hi; };
      inT = p.slice().sort(function(a,b){ return dist(a)-dist(b); }).slice(0,3);
    }
    var byS = inT.filter(function(it){ return it.st.indexOf(st) >= 0; });
    var pool = byS.length ? byS : inT;
    return {item: pool[Math.floor(r()*pool.length)], r:r};
  }
  function color(list, r, avoid){
    var opts = list.filter(function(c){ return avoid.indexOf(c) < 0; });
    var L = opts.length ? opts : list;
    return L[Math.floor(r()*L.length)];
  }

  var needInner = T<=10, needTop = T>10, needMid = T<=18, needOuter = T<=16 || (T>=19 && T<=22);
  var wantExtra = !needOuter && ((state.period==="all" && w.swing>=6) || T>=27) && T>=17;
  var picks = {}, col = {};

  if (needInner){ var a = choose("inner","inner",null,T); picks.inner=a; col.inner = color(P.light, a.r, []); }
  if (needTop){ var t = choose("top","top",null,T); picks.top=t; }
  if (needMid){ var m = choose("mid","mid",null,T); picks.mid=m; }
  if (needOuter){
    var o = choose("outer","outer", w.rain>=2 ? function(it){ return it.f.indexOf("rain")>=0; } : function(it){ return it.f.indexOf("rain")<0; }, T);
    picks.outer=o;
  }
  var onePiece = picks.top && picks.top.item.f.indexOf("one")>=0;
  if (!onePiece){ picks.bottom = choose("bottom","bottom",null,T); }
  picks.shoes = choose("shoes","shoes", w.rain>=2 ? function(it){ return it.f.indexOf("wp")>=0; } : null, T);
  var headF = null;
  if (T<=12) headF = function(it){ return it.gl==="skullcap" || it.gl==="scarf"; };
  else if (w.sunny) headF = function(it){ return it.gl==="cap" || it.gl==="bucket" || it.gl==="sunglasses"; };
  else if (state.period==="night") headF = function(it){ return it.gl!=="sunglasses"; };
  picks.head = choose("head","head",headF,T);
  picks.bag = choose("bag","bag",null,T);
  if (wantExtra){
    picks.extra = T>=23
      ? choose("extra","outer", function(it){ return it.f.indexOf("ac")>=0; }, 24)
      : choose("extra","outer", function(it){ return it.f.indexOf("rain")<0; }, T);
  }

  var layered = !!(picks.mid || picks.outer);
  if (picks.top) col.top = onePiece ? color(P.main, picks.top.r, []) : color(layered ? P.light.concat(P.light, P.main) : P.main.concat(P.light), picks.top.r, []);
  if (picks.mid) col.mid = color(P.main, picks.mid.r, [col.top, col.inner]);
  if (picks.outer) col.outer = color(P.main.concat(P.base), picks.outer.r, [col.top, col.mid]);
  if (picks.bottom) col.bottom = color(P.base, picks.bottom.r, [col.top, col.inner]);
  col.shoes = color(P.shoes, picks.shoes.r, []);
  col.head = color(P.accent.concat(P.base), picks.head.r, []);
  col.bag = color(P.accent.concat(P.base), picks.bag.r, [col.head]);
  if (picks.extra) col.extra = color(P.main.concat(P.light), picks.extra.r, [col.top]);

  var order = ["outer","mid","top","inner","bottom","shoes","head","bag","extra"];
  var pieces = [];
  order.forEach(function(k){
    if (!picks[k]) return;
    var it = picks[k].item, cname = col[k], hex = P.colors[cname];
    if (it.f.indexOf("silver")>=0){ cname = "銀"; hex = "#b9bdc4"; }
    var lab = LABELS[k];
    if (k==="top" && onePiece) lab = ["洋裝","Dress"];
    var tag = "";
    if (k==="extra") tag = (T>=27 && state.period==="all" && w.swing>=6) ? "早晚・冷氣房" : (T>=27 ? "冷氣房備用" : "早晚加穿");
    pieces.push({key:k, label:lab[0], en:lab[1], item:it, cname:cname, hex:hex, tag:tag, mat:matOf(it)});
  });
  if (w.rain>=1){
    var uc = color(P.accent, rFor("umb"), []);
    pieces.push({key:"umb", label:"雨具", en:"Rain", item:{n: w.rain>=2 ? "長柄傘" : "折疊傘", gl:"umbrella", c:0, f:""}, cname:uc, hex:P.colors[uc], tag:"", mat:"nylon"});
  }
  return pieces;
}

/* ---------- render ---------- */
var lastCopy = "", prevKeys = {};
function render(opts){
  opts = opts || {};
  var w = weatherCtx(), T = w.T, P = PALETTES[state.palette], S = STYLES[state.style];
  var pieces = build(w);
  var c = city();

  // weather band
  var dIso = w.manual ? TODAY : w.date;
  $("#wxDate").textContent = dIso.slice(5,7)+"."+dIso.slice(8,10);
  $("#wxDow").textContent = DOW_EN[dow(dIso)];
  $("#wxCity").textContent = w.manual ? "自訂條件" : c.name;
  $("#wxT").textContent = T;
  var meta = [];
  if (w.manual){
    meta.push(["Weather 天氣", w.desc]);
    meta.push(["Swing 溫差", state.mSwing ? "早晚溫差大" : "溫差不大"]);
  } else {
    meta.push(["Temp 氣溫", w.lo+"–"+w.hi+"°C"]);
    meta.push(["Feels 體感", w.flo+"–"+w.fhi+"°C"]);
    meta.push(["Sky 天氣", w.desc]);
    if (w.pp!=null) meta.push(["Rain 降雨機率", w.pp+"%"]);
    if (w.uv!=null) meta.push(["UV 紫外線", w.uv+" "+uvLabel(w.uv)]);
    if (w.wind) meta.push(["Wind 風", w.wind]);
  }
  $("#wxMeta").innerHTML = meta.map(function(m){ return '<div><dt>'+m[0]+'</dt><dd>'+esc(m[1])+'</dd></div>'; }).join("");

  // heading
  var b = band(T);
  $("#lookTitle").innerHTML = S.name+'<span class="x">×</span>'+P.name;
  var per = {all:"整天外出", day:"白天出門", night:"晚上出門"}[state.period];
  $("#lookSub").textContent = per+"・"+b[0]+"，"+b[1];

  // flat-lay tiles
  var n = pieces.length;
  var cols = n<=3 ? n : n===4 ? 4 : (n===5||n===6||n===9) ? 3 : 4;
  var flat = $("#flat");
  flat.style.setProperty("--cols", cols);
  flat.setAttribute("data-odd", n%2 ? "1" : "0");
  flat.innerHTML = pieces.map(function(p){
    var changed = opts.pop && prevKeys[p.key] && prevKeys[p.key] !== p.item.n+p.cname;
    return '<button type="button" class="tile'+(p.tag?" is-spare":"")+'" data-key="'+p.key+'" aria-label="'+esc(p.label+"："+p.cname+MAT_ZH[p.mat]+" "+p.item.n+(p.item.ref?"，參考 "+p.item.ref:"")+"，換一件")+'">'
      + '<span class="tile-slot"><b>'+p.label+'</b><i>'+p.en.toUpperCase()+'</i>'
      + (p.tag ? '<span class="tile-tag">'+p.tag+'</span>' : '') + '</span>'
      + '<span class="tile-art'+(changed?" pop":"")+'">'+svg(p.item.gl, p.hex, p.mat)+'</span>'
      + '<span class="tile-name">'+esc(p.item.n)+'</span>'
      + '<span class="tile-scale" aria-hidden="true"><i style="width:'+f2(barFor(p.item.gl).u*.88)+'%"></i>'+barFor(p.item.gl).cm+' cm</span>'
      + '<span class="tile-color"><i style="background:'+p.hex+'"></i>'+esc(p.cname)+'・'+MAT_ZH[p.mat]+'</span>'
      + (p.item.ref ? '<span class="tile-ref">參考 '+esc(p.item.ref)+'</span>' : '')
      + '</button>';
  }).join("");
  prevKeys = {}; pieces.forEach(function(p){ prevKeys[p.key] = p.item.n+p.cname; });

  // whole-outfit preview
  var fig = state.view === "fig";
  flat.hidden = fig; $("#stage").hidden = !fig;
  var vr = document.getElementById("view-"+state.view); if (vr) vr.checked = true;
  if (fig){
    var hasOuter = pieces.some(function(p){ return p.key === "outer"; });
    $("#openWrap").hidden = !hasOuter;
    $("#openOuter").checked = state.open;
    $("#fig").innerHTML = figure(pieces, state.open && hasOuter);
    $("#wearList").innerHTML = pieces.map(function(p){
      return '<li><button type="button" data-key="'+p.key+'" aria-label="'+esc(p.label+"："+p.cname+MAT_ZH[p.mat]+" "+p.item.n+"，換一件")+'">'
        + '<span class="w-fab">'+swatch(p.mat, p.hex, 3, 3)+'</span><span class="w-main"><span class="w-name"><b>'+p.label+'</b>'+esc(p.item.n)+'</span>'
        + '<span class="w-sub">'+esc(p.cname)+'・'+MAT_ZH[p.mat]+(p.item.ref ? '・參考 '+esc(p.item.ref) : '')+'</span></span>'
        + (p.key === "extra" ? '<span class="w-tag">備用，未穿上</span>' : '')+'</button></li>';
    }).join("");
  }

  // colours and fabrics used, shown as close-ups at about 10 px per cm
  var seen = {}, sw = [];
  pieces.forEach(function(p){ var k = p.cname+p.mat; if (!seen[k]){ seen[k]=1; sw.push(p); } });
  $("#strip").innerHTML = sw.map(function(p){
    return '<div class="sw"><span class="sw-fab">'+swatch(p.mat, p.hex, 30, 4.6)+'</span><span class="sw-lab">'+esc(p.cname)+'・'+MAT_ZH[p.mat]+'<em>'+p.hex+'</em></span></div>';
  }).join("");

  // notes
  var tips = [];
  if (!w.manual && state.period==="all" && w.swing>=7) tips.push("早晚溫差約 "+w.swing+"°C，用洋蔥式穿搭，中午熱了就把外層脫掉。");
  if (w.manual && state.mSwing) tips.push("早晚溫差大，用洋蔥式穿搭，外層挑方便穿脫的款式。");
  if (w.rain>=2) tips.push("預報有雨，帆布鞋和麂皮先休息，換上防水鞋款並帶把長柄傘。");
  else if (w.rain===1) tips.push("可能有短暫陣雨，包裡放一把折疊傘。");
  if (w.uv!=null && state.period!=="night"){
    if (w.uv>=8) tips.push("紫外線 "+w.uv+" 屬"+uvLabel(w.uv)+"，帽子、太陽眼鏡和防曬都用上。");
    else if (w.uv>=6) tips.push("紫外線"+uvLabel(w.uv)+"，出門前記得擦防曬。");
  }
  if (w.gust!=null && w.gust>=40) tips.push("陣風可達 "+w.gust+" km/h，帽子容易被吹走，外層挑防風材質。");
  if (T>=27) tips.push("捷運和辦公室冷氣通常很強，帶件薄外搭進室內。");
  if (w.fhi!=null && w.fhi>=34 && state.period!=="night") tips.push("體感最高到 "+w.fhi+"°C，選亞麻、棉麻這類透氣材質。");
  if (T<=10) tips.push("低溫時脖子、手腕、腳踝保暖最有感，圍巾和長襪很值得。");
  if (T>=15 && T<=22 && tips.length<2) tips.push("這個溫度最適合疊穿，內外層顏色一深一淺會更有層次。");
  if (!tips.length) tips.push("天氣穩定，照自己的風格穿就好。");
  $("#wxTips").innerHTML = tips.slice(0,3).map(function(t){ return "<li>"+esc(t)+"</li>"; }).join("");
  $("#styleTips").innerHTML = '<li class="style-li">'+esc(S.tip)+'</li><li class="style-li">'+esc(P.tip)+'</li>'
    + '<li class="style-li">'+S.name+'單品參考：'+BRANDS[state.style].map(function(b){ return '<a href="'+b[1]+'" target="_blank" rel="noopener noreferrer">'+esc(b[0])+'</a>'; }).join("、")+'</li>';

  // clo meter
  var sum = 0.06;
  pieces.forEach(function(p){ if (p.key!=="extra" && p.key!=="umb") sum += p.item.c; });
  var rec = Math.min(2.4, Math.max(0.3, 0.3 + (29-T)*0.055));
  var diff = sum - rec, cls, status;
  if (Math.abs(diff) <= 0.2){ cls="ok"; status="保暖度剛好"; }
  else if (diff < 0){ cls="cold"; status="偏涼，可以再加一層"; }
  else { cls="warn"; status="偏熱，可以少穿一件"; }
  var MAX = 2.5, pct = function(v){ return Math.min(100, v/MAX*100).toFixed(1); };
  $("#clo").innerHTML =
      '<div class="clo-head"><div class="lbl-sm"><b>保暖度</b>Clo</div><span class="pill '+cls+'">'+status+'</span></div>'
    + '<div><div class="bar" role="img" aria-label="這套約 '+sum.toFixed(2)+' clo，建議約 '+rec.toFixed(2)+' clo"><span class="fill" style="width:'+pct(sum)+'%"></span><span class="mark" style="left:'+pct(rec)+'%"></span></div>'
    + '<div class="scale" aria-hidden="true">'+[0,0.5,1,1.5,2].map(function(v){ return '<span style="left:'+pct(v)+'%">'+(v===0?"0":v.toFixed(1))+'</span>'; }).join("")+'</div></div>'
    + '<div class="legend"><span><i></i>這套約 '+sum.toFixed(2)+' clo</span><span><i class="m"></i>'+T+'°C 建議約 '+rec.toFixed(2)+' clo</span></div>'
    + '<p class="fine">clo 是衣物隔熱單位，1 clo 約等於一套西裝。數值依 ISO 9920 的常見衣物值粗估，備用外套和雨具不列入。</p>';

  // copy text
  var head = w.manual ? "OOTD｜自訂條件 "+mmdd(TODAY) : "OOTD｜"+c.name+" "+mmdd(w.date)+"（"+DOW_ZH[dow(w.date)]+"）";
  lastCopy = [head, "穿搭體感 "+T+"°C・"+w.desc, S.name+" × "+P.name+"・"+per, ""]
    .concat(pieces.map(function(p){ return p.label+"　"+p.item.n+"・"+p.cname+(p.tag?"（"+p.tag+"）":"")+(p.item.ref?"　參考 "+p.item.ref:""); }))
    .join("\n");
}

  state.bump[k] = (state.bump[k]||0) + 1;
  render({pop:true});
  var again = document.querySelector(box+' [data-key="'+k+'"]'); if (again) again.focus();
});
$("#viewSeg").addEventListener("change", function(e){ state.view = e.target.value; savePrefs(); render(); });
$("#openOuter").addEventListener("change", function(e){ state.open = e.target.checked; render(); });
$("#shuffle").addEventListener("click", function(){ state.shuffle++; state.bump = {}; render({pop:true}); });
$("#copy").addEventListener("click", function(){
  var t = lastCopy;
  function fallback(){
    var ta = $("#copyBox"); ta.value = t; ta.hidden = false; ta.focus(); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch(err){}
    if (ok){ ta.hidden = true; toast("已複製穿搭清單"); } else toast("無法自動複製，文字已選取，請手動複製");
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ $("#copyBox").hidden = true; toast("已複製穿搭清單"); }, fallback);
    } else fallback();
  } catch(err){ fallback(); }
});
$("#toastBtn").addEventListener("click", function(){
  $("#toast").hidden = true;
  $("#look").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
});

/* ---------- AccuWeather live forecast through the viewer's connector ---------- */
var MCPS = "AccuWeather®", DAILY = "widgets-daily-claude", SEARCH = "widgets-search-claude";
var mcp = null, unwatch = null, retried = {}, liveStatus = {mode:"loading"}, PROV = "AccuWeather", OM = false;

function parsePayload(res){
  var p = res && res.payload;
  if (typeof p === "string"){ try { p = JSON.parse(p); } catch(e){ return null; } }
  return p && typeof p === "object" ? p : null;
}
function num(v){ return typeof v === "number" && isFinite(v) ? v : null; }
function ingest(key, res){
  var p = parsePayload(res);
  if (!p || !Array.isArray(p.dailyForecast)) return false;
  var out = p.dailyForecast.map(function(d){
    var day = d && d.day || {}, night = d && d.night || {}, dx = day.extended || {};
    var dt = String(d && d.date || "").slice(0,10);
    var hi = num(day.temperature), lo = num(night.temperature);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt) || hi==null || lo==null) return null;
    var fhi = num(day.realFeelValue), flo = num(night.realFeelValue);
    if (fhi==null) fhi = hi; if (flo==null) flo = lo;
    var uv = dx.uv ? num(dx.uv.value) : null;
    var gust = parseInt(String(dx.gusts||""), 10);
    return [dt, Math.round(Math.min(lo,hi)), Math.round(Math.max(lo,hi)), Math.round(Math.min(flo,fhi)), Math.round(Math.max(flo,fhi)),
      uv==null ? null : Math.round(uv), accu(day.icon, day.iconPhrase), accu(night.icon, night.iconPhrase),
      num(day.rainProbabilityValue), num(night.rainProbabilityValue), typeof dx.wind==="string" ? dx.wind.slice(0,24) : null, isFinite(gust) ? gust : null];
  }).filter(Boolean);
  if (!out.length) return false;
  var loc = p.location || {}, lt = String(loc.localIsoDate||"").slice(0,10);
  LIVE[key] = {rows: out, today: /^\d{4}-\d{2}-\d{2}$/.test(lt) ? lt : TODAY, at: (res.cache && res.cache.storedAt) || Date.now()};
  return true;
}
function hhmm(ms){ try { return new Intl.DateTimeFormat("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(ms)); } catch(e){ return ""; } }
function fallbackText(){ return hasSnapshot(city()) ? "目前用中央氣象署 10/12 預報快照。" : "先用自訂氣溫來搭。"; }
function placeNote(){ var c = city(); return c.sub ? "・對應地點 "+c.sub : ""; }
function setStatus(mode, text, btnLabel, btnFn){
  liveStatus = {mode:mode};
  $("#wxStatus").setAttribute("data-mode", mode);
  $("#wxStatusText").textContent = text;
  var b = $("#wxStatusBtn");
  if (btnLabel){ b.hidden = false; b.textContent = btnLabel; b.onclick = btnFn; } else { b.hidden = true; b.onclick = null; }
  var live = city().key && LIVE[city().key], src = $("#src");
  if (live && OM) src.innerHTML = '天氣資料 <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>';
  else src.textContent = live ? "AccuWeather 即時預報" : "中央氣象署一週預報・10/12 擷取";
}
function openPerms(){
  window.claude.use("permissions").then(function(p){ return p ? p.manage() : Promise.reject(); })
    .catch(function(){ setStatus("warn", "請從這個頁面的權限選單開啟 AccuWeather。"+fallbackText()); });
}
function inputFor(key){ return {queryParams:{locationKey:key, unit:"metric"}}; }
function showLive(key){
  if (key !== city().key || !LIVE[key]) return;
  setStatus("live", PROV+" 即時預報・"+hhmm(LIVE[key].at)+" 更新"+placeNote());
  renderDays(); render();
}
function askOnce(key, input){
  mcp.callTool(MCPS, DAILY, input).then(function(res){
    if (ingest(key, res)) showLive(key, res); else setStatus("warn", "AccuWeather 回傳的資料讀不懂。"+fallbackText());
  }, function(err){ handleErr(err, key, input); });
}
function handleErr(err, key, input){
  var code = (err && err.code) || "upstream_error";
  var deny = ["needs_reauth","server_not_connected","selection_required","blocked_by_policy","approval_required","not_in_manifest","consent_required","not_granted","capability_disabled","capability_removed","user_changed"];
  if (deny.indexOf(code) >= 0) delete LIVE[key];
  if (key !== city().key) return;
  var fb = fallbackText(), kept = !!LIVE[key];
  if (code==="user_changed") return;
  if (code==="server_not_connected" || code==="selection_required") setStatus("warn", "到 claude.ai 的「設定 → 連接器」加入 AccuWeather®，就能看即時天氣。"+fb);
  else if (code==="needs_reauth") setStatus("warn", "AccuWeather® 需要重新連線，請到 claude.ai 的「設定 → 連接器」重新連接。"+fb);
  else if (code==="approval_required") setStatus("warn", "讀取 AccuWeather 需要你同意。"+fb, "同意並讀取", function(){ askOnce(key, input); });
  else if (code==="not_in_manifest" || code==="consent_required") setStatus("warn", "這個頁面目前沒有 AccuWeather 的使用權限。"+fb, "權限設定", openPerms);
  else if (code==="blocked_by_policy") setStatus("warn", "組織政策不允許這個頁面使用 AccuWeather。"+fb);
  else if (code==="not_granted" || code==="capability_disabled" || code==="capability_removed") setStatus("snap", "這個檢視無法連線 AccuWeather。"+fb);
  else if (code==="tool_error") setStatus("warn", "AccuWeather 回報錯誤："+((err && err.message) || "未知錯誤")+"。"+(kept ? "先顯示上一次的結果。" : fb));
  else if (err && err.retryable && !retried[key]){
    retried[key] = true;
    setStatus(kept ? "live" : "warn", "AccuWeather 暫時沒有回應，稍後自動重試。"+(kept ? "先顯示上一次的結果。" : fb));
    setTimeout(function(){ if (mcp) mcp.invalidate(MCPS, DAILY, input).catch(function(){}); }, (err.retryAfterMs || 0) + 2000 + Math.random()*3000);
  }
  else setStatus(kept ? "live" : "warn", "暫時拿不到 AccuWeather 資料。"+(kept ? "先顯示上一次的結果。" : fb));
  renderDays(); render();
}
function watchCurrent(){
  if (OM){ omLoad(false); return; }
  if (unwatch){ try { unwatch(); } catch(e){} unwatch = null; }
  if (!mcp) return;
  var c = city(); if (!c.key) return;
  var key = c.key, input = inputFor(key);
  if (LIVE[key]) showLive(key, null);
  else setStatus("loading", "正在向 AccuWeather 取得"+c.name+"的天氣…");
  try {
    unwatch = mcp.watchTool(MCPS, DAILY, input, function(ev){
      if (ev.type === "data"){
        if (ingest(key, ev.result)){ retried[key] = false; showLive(key, ev.result); }
        else if (key === city().key) setStatus("warn", "AccuWeather 回傳的資料讀不懂。"+fallbackText());
      } else handleErr(ev.error, key, input);
    }, {cache:{staleTime:300000, gcTime:3600000}, refetchInterval:1800000});
  } catch(e){ setStatus("warn", "暫時拿不到 AccuWeather 資料。"+fallbackText()); }
}
function syncSearch(){
  var on = !!mcp || OM;
  $("#qBtn").disabled = !on;
  $("#q").disabled = !on;
  $("#q").placeholder = OM ? "搜尋其他城市，例如 東京、Seoul" : mcp ? "搜尋其他城市，例如 Tokyo, Japan" : "連上 AccuWeather 後可搜尋其他城市";
}
function showFound(t){ var f = $("#found"); f.textContent = t; f.hidden = !t; }
$("#searchForm").addEventListener("submit", function(e){
  e.preventDefault();
  var q = $("#q").value.trim().slice(0,60);
  if (!q || !(mcp || OM)) return;
  if (OM){ omSearch(q); return; }
  $("#qBtn").disabled = true; showFound("搜尋中…");
  mcp.callTool(MCPS, SEARCH, {queryParams:{query:q}}, {cache:{staleTime:300000}}).then(function(res){
    var p = parsePayload(res), hit = p && Array.isArray(p.results) ? p.results[0] : null;
    var key = hit && String(hit.locationKey||"");
    if (!key || !/^[0-9A-Za-z_-]{1,40}$/.test(key)){ showFound("找不到「"+q+"」。試試英文名稱加國家，例如 Tokyo, Japan。"); return; }
    var id = "q:"+key, sub = String(hit.name||"").slice(0,80);
    PLACES = [{id:id, name:q, sub:sub, key:key, d:[]}].concat(PLACES.filter(function(x){ return x.id !== id; })).slice(0,5);
    savePlaces();
    state.city = id; $("#q").value = "";
    renderCities(); renderDays(); changed(); watchCurrent();
    showFound("AccuWeather 對應到 "+sub+"。地點不對的話，換個寫法再搜一次，例如加上國家。");
  }, function(err){
    var code = err && err.code;
    showFound(code==="server_not_connected" ? "先到 claude.ai 的「設定 → 連接器」加入 AccuWeather®。"
      : (code==="not_in_manifest" || code==="consent_required" || code==="approval_required") ? "搜尋需要先允許這個頁面使用 AccuWeather。"
      : code==="tool_error" ? "搜尋失敗："+((err && err.message) || "未知錯誤")
      : "現在無法搜尋地點，稍後再試。");
  }).then(function(){ $("#qBtn").disabled = !(mcp || OM); });
});
function startLive(){
  if (!window.claude || typeof window.claude.use !== "function"){ startOM(); return; }
  window.claude.use("mcp").then(function(ns){
    mcp = ns || null; syncSearch();
    if (!mcp){ setStatus("snap", "這個檢視無法連線 AccuWeather。"+fallbackText()); renderDays(); render(); return; }
    // use the connector name exactly as the page's manifest lists it
    var listed; try { listed = mcp.listTools(); } catch(e){ listed = Promise.reject(e); }
    Promise.resolve(listed).then(function(r){
      var s = (r && r.servers || []).filter(function(x){ return /accuweather/i.test(x.server); })[0];
      if (s) MCPS = s.server;
    }).catch(function(){}).then(watchCurrent);
  }, function(){ syncSearch(); setStatus("snap", "這個檢視無法連線 AccuWeather。"+fallbackText()); });
}

/* ---------- outside Claude (the public copy): Open-Meteo forecast and place search, no account or key needed ---------- */
var OM_DAILY = "weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,uv_index_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant";
var WMO = {0:"晴",1:"晴時多雲",2:"多雲時晴",3:"陰",45:"霧",48:"霧",51:"毛毛雨",53:"毛毛雨",55:"毛毛雨",56:"凍毛毛雨",57:"凍毛毛雨",
  61:"小雨",63:"雨",65:"大雨",66:"凍雨",67:"凍雨",71:"小雪",73:"雪",75:"大雪",77:"霰",80:"短暫陣雨",81:"陣雨",82:"強陣雨",85:"陣雪",86:"大陣雪",
  95:"雷雨",96:"雷雨夾冰雹",99:"雷雨夾冰雹"};
var CMP = ["N","NE","E","SE","S","SW","W","NW"], omSeq = 0;
function omKey(lat, lon){ return "om:"+(+lat).toFixed(3)+","+(+lon).toFixed(3); }
function omPos(key){ var m = /^om:(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)$/.exec(key||""); return m ? {lat:+m[1], lon:+m[2]} : null; }
function prevISO(iso){ var p = iso.split("-").map(Number), t = new Date(Date.UTC(p[0], p[1]-1, p[2]-1)); return t.toISOString().slice(0,10); }
/* one line for a stretch of hours: thunder wins, rain needs three hours to lead, a shorter shower is added to the sky */
function omDesc(codes){
  var n = {}, rainH = 0, thunder = 0;
  codes.forEach(function(c){ if (c == null) return; n[c] = (n[c]||0) + 1; if (c >= 95) thunder++; else if (c >= 51) rainH++; });
  var top = function(f){ var k = null; Object.keys(n).forEach(function(s){ var c = +s; if (f(c) && (k == null || n[c] > n[k] || (n[c] === n[k] && c > k))) k = c; }); return k; };
  if (thunder) return WMO[top(function(c){ return c >= 95; })];
  if (rainH >= 3) return WMO[top(function(c){ return c >= 51 && c < 95; })];
  var dry = top(function(c){ return c < 51; });
  if (rainH) return (dry == null || dry === 0 ? "晴時多雲" : WMO[dry]) + "短暫陣雨";
  return dry == null ? null : WMO[dry];
}
/* daily rows in the same shape as the AccuWeather ones; daytime is 06:00-17:59, the night runs to 05:59 next morning */
function omIngest(key, j){
  var d = j && j.daily, h = j && j.hourly;
  if (!d || !Array.isArray(d.time) || !h || !Array.isArray(h.time)) return false;
  var A = function(o, k, i){ return Array.isArray(o[k]) ? num(o[k][i]) : null; }, hrs = {};
  h.time.forEach(function(t, i){
    var dt = String(t).slice(0,10), hr = parseInt(String(t).slice(11,13), 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt) || !isFinite(hr)) return;
    var day = hr >= 6 && hr < 18, k = hr < 6 ? prevISO(dt) : dt;
    var b = hrs[k] || (hrs[k] = {dc:[], dp:[], nc:[], np:[]});
    (day ? b.dc : b.nc).push(A(h, "weather_code", i)); (day ? b.dp : b.np).push(A(h, "precipitation_probability", i));
  });
  var mx = function(a){ var v = null; a.forEach(function(x){ if (x != null && (v == null || x > v)) v = x; }); return v; };
  var out = d.time.map(function(dt, i){
    var hi = A(d, "temperature_2m_max", i), lo = A(d, "temperature_2m_min", i);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dt)) || hi == null || lo == null) return null;
    var fhi = A(d, "apparent_temperature_max", i), flo = A(d, "apparent_temperature_min", i);
    if (fhi == null) fhi = hi; if (flo == null) flo = lo;
    var uv = A(d, "uv_index_max", i), b = hrs[dt] || {dc:[], dp:[], nc:[], np:[]};
    var dd = omDesc(b.dc) || WMO[A(d, "weather_code", i)] || "多雲", nd = omDesc(b.nc) || dd;
    var ws = A(d, "wind_speed_10m_max", i), wd = A(d, "wind_direction_10m_dominant", i), wg = A(d, "wind_gusts_10m_max", i);
    var wind = ws == null ? null : (wd == null ? "" : CMP[Math.round(wd/45) % 8]+" ") + Math.round(ws)+" km/h";
    return [dt, Math.round(Math.min(lo,hi)), Math.round(Math.max(lo,hi)), Math.round(Math.min(flo,fhi)), Math.round(Math.max(flo,fhi)),
      uv == null ? null : Math.round(uv), dd, nd, mx(b.dp), mx(b.np), wind, wg == null ? null : Math.round(wg)];
  }).filter(Boolean);
  if (!out.length) return false;
  LIVE[key] = {rows: out, today: out[0][0], at: Date.now()};
  return true;
}
function omLoad(force){
  var c = city(), key = c.key, pos = omPos(key);
  if (!pos){ setStatus("snap", fallbackText()); return; }
  var L = LIVE[key];
  if (L && !force && Date.now() - L.at < 600000){ showLive(key); return; }
  if (L) showLive(key); else { setStatus("loading", "正在向 Open-Meteo 取得"+c.name+"的天氣…"); renderDays(); }
  var seq = ++omSeq;
  fetch("https://api.open-meteo.com/v1/forecast?latitude="+pos.lat+"&longitude="+pos.lon+"&daily="+OM_DAILY
    + "&hourly=weather_code,precipitation_probability&timezone=auto&forecast_days=7&wind_speed_unit=kmh")
    .then(function(r){ if (!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ if (!omIngest(key, j)) throw new Error("bad data"); showLive(key); })
    .catch(function(){
      if (key !== city().key || seq !== omSeq) return;
      var kept = !!LIVE[key];
      setStatus(kept ? "live" : "warn", "暫時拿不到 Open-Meteo 資料。"+(kept ? "先顯示上一次的結果。" : fallbackText()), "重試", function(){ omLoad(true); });
      renderDays(); render();
    });
}
function omSearch(q){
  $("#qBtn").disabled = true; showFound("搜尋中…");
  fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name="+encodeURIComponent(q))
    .then(function(r){ if (!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      var hit = j && Array.isArray(j.results) ? j.results[0] : null, lat = hit && num(hit.latitude), lon = hit && num(hit.longitude);
      if (lat == null || lon == null){ showFound("找不到「"+q+"」。換個寫法再試，例如英文名稱 Tokyo。"); return; }
      var key = omKey(lat, lon), id = "q:"+key;
      var sub = [hit.name, hit.admin1, hit.country].filter(function(x, i, a){ return typeof x === "string" && x && a.indexOf(x) === i; }).join("、").slice(0,80);
      PLACES = [{id:id, name:q.slice(0,40), sub:sub, key:key, d:[]}].concat(PLACES.filter(function(x){ return x.id !== id; })).slice(0,5);
      savePlaces();
      state.city = id; $("#q").value = "";
      renderCities(); renderDays(); changed(); watchCurrent();
      showFound("Open-Meteo 對應到 "+sub+"。地點不對的話，換個寫法再搜一次。");
    })
    .catch(function(){ showFound("現在無法搜尋地點，稍後再試。"); })
    .then(function(){ $("#qBtn").disabled = false; });
}
function startOM(){
  OM = true; PROV = "Open-Meteo";
  CITIES.forEach(function(c){ if (c.lat != null) c.key = omKey(c.lat, c.lon); });
  PLACES = PLACES.filter(function(p){ return omPos(p.key); });
  if (!byId(state.city)) state.city = "tpe";
  renderCities(); syncSearch(); omLoad(false);
  setInterval(function(){ if (!document.hidden) omLoad(true); }, 1800000);
}

/* ---------- boot ---------- */
document.body.insertAdjacentHTML("afterbegin", FX);
renderCities(); renderPalettes(); renderStyles(); syncRadios(); renderDays(); render(); syncSearch(); startLive();
})();
</script>
